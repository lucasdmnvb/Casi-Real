    <path d="M300 228 L300 268" fill="none" stroke="#172326" stroke-width="5" stroke-linecap="round"/>
    <path d="M300 228 L326 250" fill="none" stroke="#172326" stroke-width="3" stroke-linecap="round"/>
    <circle cx="300" cy="350" r="20" fill="#F4D7B5"/><circle cx="300" cy="350" r="12" fill="#F9E2C9"/>
