    <linearGradient id="bandTP" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#E7E9E2"/></linearGradient>
    <radialGradient id="screenTP" cx="50%" cy="30%" r="50%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="70%" stop-color="#E4E9E4"/><stop offset="100%" stop-color="#C9D2C9"/></radialGradient>
    <filter id="shadowTP" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dx="0" dy="10" result="offsetblur"/><feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
