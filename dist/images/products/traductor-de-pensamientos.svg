    <ellipse cx="300" cy="175" rx="120" ry="62" fill="url(#screenTP)" opacity="0.9"/><ellipse cx="300" cy="175" rx="90" ry="42" fill="#FFFFFF" opacity="0.85"/>
    <path d="M250 175 q10 -14 20 0 q10 14 20 0 M290 175 q10 -14 20 0 q10 14 20 0" fill="none" stroke="#73548B" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
