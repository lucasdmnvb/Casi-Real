    <path d="M210 360 l58 -70 l54 40 l70 -96" fill="none" stroke="#315D95" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M392 234 l0 -32 M392 202 l-18 8 M392 202 l18 8" fill="none" stroke="#315D95" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="210" cy="360" r="10" fill="#FFFFFF" stroke="#315D95" stroke-width="5"/>
    <path d="M210 414 h180" stroke="#D5DEEF" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="300" y="562" text-anchor="middle" fill="#315D95" font-family="Georgia, serif" font-size="15" letter-spacing="0.6">Arte conceptual — no es un prototipo funcional</text>
</svg>
