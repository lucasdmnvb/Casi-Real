<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Pausador de Tiempo Pocket: control remoto metálico con símbolo de pausa iluminado">
  <defs>
    <linearGradient id="bgPT" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5F5EF"/><stop offset="100%" stop-color="#EFEEE4"/></linearGradient>
    <linearGradient id="remotePT" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#D9DDE3"/></linearGradient>
    <filter id="shadowPT" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dx="0" dy="10" result="offsetblur"/><feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgPT)"/>
  <g filter="url(#shadowPT)">
    <rect x="205" y="190" width="190" height="240" rx="30" fill="url(#remotePT)" stroke="#A8ADB4" stroke-width="2"/>
    <rect x="215" y="200" width="170" height="34" rx="16" fill="#B8C0B6"/>
    <circle cx="285" cy="300" r="26" fill="#172326"/><circle cx="285" cy="300" r="16" fill="#315D95"/>
    <rect x="272" y="286" width="10" height="28" rx="3" fill="#FFFFFF"/><rect x="300" y="286" width="10" height="28" rx="3" fill="#FFFFFF"/>
    <circle cx="315" cy="300" r="12" fill="#315D95" opacity="0.35"/>
    <rect x="268" y="418" width="64" height="12" rx="6" fill="#9FA7AE"/>
  </g>
  <text x="300" y="560" text-anchor="middle" fill="#315D95" font-family="Georgia, serif" font-size="15" letter-spacing="0.6">Arte conceptual — no detiene el tiempo</text>
</svg>
