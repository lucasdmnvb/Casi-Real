<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Botón de Fin de Semana: gran pulsador sobre una base que adelanta el viernes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5F5EF"/><stop offset="100%" stop-color="#ECEEE8"/></linearGradient>
    <linearGradient id="dev" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#DCE6E1"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="474" rx="150" ry="26" fill="#2F5D50" opacity="0.10"/>
  <g filter="url(#sh)">
    <rect x="170" y="330" width="260" height="96" rx="24" fill="url(#dev)" stroke="#B4C4BD" stroke-width="2.5"/>
    <ellipse cx="300" cy="330" rx="130" ry="42" fill="#FFFFFF" stroke="#B4C4BD" stroke-width="2.5"/>
    <ellipse cx="300" cy="322" rx="86" ry="30" fill="#2F5D50"/>
    <ellipse cx="300" cy="314" rx="86" ry="26" fill="#3C7061"/>
    <text x="300" y="322" text-anchor="middle" fill="#D9F36A" font-family="Georgia, serif" font-size="20" letter-spacing="1">VIERNES</text>
  </g>
  <text x="300" y="562" text-anchor="middle" fill="#2F5D50" font-family="Georgia, serif" font-size="15" letter-spacing="0.6">Arte conceptual — no es un prototipo funcional</text>
</svg>
