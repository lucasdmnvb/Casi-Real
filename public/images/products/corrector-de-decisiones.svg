<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Corrector de Decisiones: dos caminos que se fusionan en una marca de verificación">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5F5EF"/><stop offset="100%" stop-color="#EEEBE2"/></linearGradient>
    <linearGradient id="dev" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F0E1D6"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="474" rx="150" ry="26" fill="#B86830" opacity="0.10"/>
  <g filter="url(#sh)">
    <circle cx="300" cy="300" r="140" fill="url(#dev)" stroke="#D3BFB0" stroke-width="2.5"/>
    <path d="M214 236 q70 60 86 128" fill="none" stroke="#B86830" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 20"/>
    <path d="M386 236 q-70 60 -86 128" fill="none" stroke="#B86830" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 20"/>
    <path d="M258 322 l34 40 l62 -84" fill="none" stroke="#2F5D50" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="214" cy="236" r="12" fill="#FFFFFF" stroke="#B86830" stroke-width="5"/>
    <circle cx="386" cy="236" r="12" fill="#FFFFFF" stroke="#B86830" stroke-width="5"/>
  </g>
  <text x="300" y="562" text-anchor="middle" fill="#B86830" font-family="Georgia, serif" font-size="15" letter-spacing="0.6">Arte conceptual — no es un prototipo funcional</text>
</svg>
