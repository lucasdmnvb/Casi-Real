<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Filtro de Recuerdos Vergonzosos: lente de cámara con un velo que difumina lo que preferirías olvidar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5F5EF"/><stop offset="100%" stop-color="#EDECE2"/></linearGradient>
    <linearGradient id="dev" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#E6E2EC"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="474" rx="150" ry="26" fill="#6D4E8C" opacity="0.10"/>
  <g filter="url(#sh)">
    <rect x="164" y="196" width="272" height="200" rx="34" fill="url(#dev)" stroke="#C6C2CE" stroke-width="2.5"/>
    <circle cx="300" cy="296" r="82" fill="#FFFFFF" stroke="#6D4E8C" stroke-width="3.5"/>
    <circle cx="300" cy="296" r="54" fill="#6D4E8C" opacity="0.14"/>
    <circle cx="300" cy="296" r="34" fill="none" stroke="#6D4E8C" stroke-width="3"/>
    <path d="M240 358 q60 -46 120 0" fill="none" stroke="#6D4E8C" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <rect x="196" y="176" width="52" height="30" rx="9" fill="url(#dev)" stroke="#C6C2CE" stroke-width="2.5"/>
  </g>
  <text x="300" y="562" text-anchor="middle" fill="#6D4E8C" font-family="Georgia, serif" font-size="15" letter-spacing="0.6">Arte conceptual — no es un prototipo funcional</text>
</svg>
