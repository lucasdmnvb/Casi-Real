    <path d="M366 236 l30 -18 M234 218 l-18 -12" stroke="#B7B2C4" stroke-width="6" stroke-linecap="round"/>
    <path d="M222 330 h60 M318 330 h60" stroke="#D6D3DE" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="300" y="562" text-anchor="middle" fill="#6D4E8C" font-family="Georgia, serif" font-size="15" letter-spacing="0.6">Arte conceptual — no es un prototipo funcional</text>
