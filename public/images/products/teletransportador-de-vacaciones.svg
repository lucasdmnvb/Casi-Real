<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Teletransportador de Vacaciones: portal circular con playa luminosa al fondo">
  <defs>
    <linearGradient id="bgTV" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5F5EF"/><stop offset="100%" stop-color="#EFEEE4"/></linearGradient>
    <linearGradient id="portalTV" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="50%" stop-color="#E2E7DD"/><stop offset="100%" stop-color="#C9D1C1"/></linearGradient>
    <radialGradient id="glowTV" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#F6D865"/><stop offset="60%" stop-color="rgba(246,216,101,0)"/></radialGradient>
    <filter id="shadowTV" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dx="0" dy="10" result="offsetblur"/><feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgTV)"/>
  <g filter="url(#shadowTV)">
    <circle cx="300" cy="300" r="110" fill="#2C3E3A"/><circle cx="300" cy="300" r="86" fill="#172326"/>
    <circle cx="300" cy="300" r="78" fill="url(#portalTV)" stroke="#A8ADB4" stroke-width="3"/>
    <rect x="262" y="150" width="76" height="150" rx="8" fill="#D9DDE3" opacity="0.6"/>
    <rect x="262" y="300" width="76" height="150" rx="8" fill="#D9DDE3" opacity="0.6"/>
    <circle cx="300" cy="300" r="96" fill="url(#glowTV)"/>
    <path d="M230 300 q20 -40 70 0 q20 40 70 0" fill="none" stroke="#315D95" stroke-width="3" opacity="0.5"/>
    <rect x="268" y="450" width="64" height="12" rx="6" fill="#315D95"/>
  </g>
  <text x="300" y="572" text-anchor="middle" fill="#315D95" font-family="Georgia, serif" font-size="15" letter-spacing="0.6">Arte conceptual — no ofrece teletransportación real</text>
</svg>
